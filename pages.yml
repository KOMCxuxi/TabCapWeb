name: Deploy TabCap Web (PWA) to GitHub Pages

# 這個 workflow 假設本資料夾（TabCapWeb）就是倉庫根目錄。
# 用法：推到 GitHub → Settings → Pages → Build and deployment → Source: GitHub Actions。
# 之後每次 push 到 main 都會自動重新部署。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage static site
        run: |
          mkdir -p _site
          cp -r index.html styles.css app.js js vendor assets manifest.webmanifest sw.js _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
